# Validates JSON Resume, generates PDF/HTML under dist/, builds the React app, deploys to GitHub Pages.
#
# If deploy fails with: HttpError: Not Found (createPagesDeployment):
# 1) Settings → Pages → Build and deployment → Source: "GitHub Actions" (not "Deploy from a branch").
# 2) Settings → Actions → General → Workflow permissions: allow workflows to read/write (or keep default;
#    the permissions block below still requests pages:write + id-token:write).
# 3) Private repo: GitHub Pages from Actions needs a plan that includes Pages for private repos.
#
# After changing Pages source to GitHub Actions, re-run the failed workflow.

name: Resume

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npm run validate

      - name: Generate HTML and PDF
        run: npm run build

      # Vite base defaults to ./ (relative) so github.io/user/repo and custom domain root both work.

      - run: npm run typecheck:web

      - name: Build React site
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: |
            dist/pdf/resume-en.pdf
            dist/pdf/resume-fr.pdf

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
